<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="netBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="netCover" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#netBg)"/>
  <g transform="translate(180, 50)">
    <rect x="15" y="15" width="230" height="320" rx="8" fill="#021f18" opacity="0.6"/>
    <rect x="8" y="8" width="230" height="320" rx="6" fill="#f8fafc"/>
    <rect x="0" y="0" width="225" height="320" rx="6" fill="url(#netCover)"/>
    <rect x="0" y="45" width="225" height="80" fill="#064e3b" opacity="0.95"/>
    <text x="20" y="75" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#a7f3d0">COMPUTER</text>
    <text x="20" y="98" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#ffffff">NETWORKING</text>
    <text x="20" y="116" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#6ee7b7">A TOP-DOWN APPROACH</text>
    <!-- Network Topology Graphic -->
    <g transform="translate(30, 150)" stroke="#6ee7b7" stroke-width="2" fill="none">
      <circle cx="80" cy="20" r="10" fill="#064e3b"/>
      <circle cx="30" cy="70" r="10" fill="#064e3b"/>
      <circle cx="130" cy="70" r="10" fill="#064e3b"/>
      <circle cx="80" cy="110" r="14" fill="#047857"/>
      <line x1="80" y1="30" x2="30" y2="60"/>
      <line x1="80" y1="30" x2="130" y2="60"/>
      <line x1="30" y1="80" x2="70" y2="100"/>
      <line x1="130" y1="80" x2="90" y2="100"/>
    </g>
    <text x="20" y="295" font-family="system-ui, sans-serif" font-size="11" fill="#d1fae5">KUROSE &amp; ROSS · 7TH EDITION</text>
  </g>
