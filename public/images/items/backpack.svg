<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="packBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#packBg)"/>
  <!-- Backpack Form -->
  <g transform="translate(190, 45)">
    <!-- Top Carry Handle -->
    <path d="M 70,50 C 70,20 150,20 150,50" fill="none" stroke="#e11d48" stroke-width="12" stroke-linecap="round"/>
    <!-- Main Body -->
    <path d="M 40,90 C 40,45 180,45 180,90 L 200,290 C 200,310 185,320 110,320 C 35,320 20,310 20,290 Z" fill="url(#bagGrad)" stroke="#334155" stroke-width="2"/>
    <!-- Front Compartment Pocket -->
    <path d="M 45,170 C 45,150 175,150 175,170 L 180,285 C 180,298 165,305 110,305 C 55,305 40,298 40,285 Z" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <!-- Contrast Red Zipper Tracks -->
    <path d="M 45,120 Q 110,105 175,120" fill="none" stroke="#e11d48" stroke-width="4"/>
    <path d="M 50,185 Q 110,175 170,185" fill="none" stroke="#e11d48" stroke-width="4"/>
    <!-- Brand badge -->
    <rect x="95" y="225" width="30" height="15" rx="3" fill="#e11d48"/>
    <!-- Water Bottle Mesh Pocket Left & Right -->
    <rect x="18" y="200" width="16" height="60" rx="4" fill="#64748b" opacity="0.6"/>
    <rect x="186" y="200" width="16" height="60" rx="4" fill="#64748b" opacity="0.6"/>
  </g>
  <text x="300" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#f43f5e">WILDCRAFT 30L WATER-RESISTANT BACKPACK</text>
  <text x="300" y="415" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Dedicated Padded 15.6" Laptop Sleeve · Heavy Duty</text>
</svg>
