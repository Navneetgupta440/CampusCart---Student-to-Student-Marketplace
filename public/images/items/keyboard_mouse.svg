<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="kmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#kmBg)"/>
  <!-- Keyboard & Mouse Setup -->
  <g transform="translate(60, 90)">
    <!-- Keyboard Body -->
    <rect x="0" y="50" width="350" height="150" rx="14" fill="#1e222d" stroke="#334155" stroke-width="2"/>
    <!-- Key Rows -->
    <g fill="#334155" rx="3">
      <!-- Function Row -->
      <rect x="18" y="66" width="16" height="12" rx="2"/>
      <rect x="40" y="66" width="16" height="12" rx="2"/>
      <rect x="62" y="66" width="16" height="12" rx="2"/>
      <rect x="84" y="66" width="16" height="12" rx="2"/>
      <rect x="110" y="66" width="16" height="12" rx="2"/>
      <rect x="132" y="66" width="16" height="12" rx="2"/>
      <rect x="154" y="66" width="16" height="12" rx="2"/>
      <rect x="176" y="66" width="16" height="12" rx="2"/>
      <!-- Number Row -->
      <rect x="18" y="85" width="295" height="16" rx="2" fill="#2d3748"/>
      <!-- QWERTY Row -->
      <rect x="18" y="106" width="295" height="16" rx="2" fill="#2d3748"/>
      <!-- ASDF Row -->
      <rect x="18" y="127" width="295" height="16" rx="2" fill="#2d3748"/>
      <!-- Spacebar Row -->
      <rect x="18" y="148" width="40" height="18" rx="2"/>
      <rect x="65" y="148" width="150" height="18" rx="3" fill="#475569"/>
      <rect x="222" y="148" width="90" height="18" rx="2"/>
    </g>
    <!-- Mouse -->
    <g transform="translate(385, 60)">
      <rect x="0" y="0" width="75" height="125" rx="36" fill="#1e222d" stroke="#334155" stroke-width="2"/>
      <!-- Mouse scroll wheel & buttons separator -->
      <line x1="37" y1="10" x2="37" y2="55" stroke="#334155" stroke-width="2"/>
      <rect x="33" y="24" width="8" height="18" rx="3" fill="#38bdf8"/>
    </g>
    <!-- USB Dongle -->
    <g transform="translate(390, 195)">
      <rect x="0" y="0" width="28" height="14" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <rect x="28" y="3" width="14" height="8" rx="1" fill="#cbd5e1"/>
    </g>
  </g>
  <text x="300" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#38bdf8">LOGITECH MK215 WIRELESS COMBO</text>
  <text x="300" y="405" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">2.4 GHz USB Dongle · Whisper-Quiet Keys · Fresh Batteries</text>
</svg>
