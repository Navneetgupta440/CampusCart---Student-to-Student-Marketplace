<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="bgL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bgL)"/>
  <!-- Laptop Stand Isometric View -->
  <g transform="translate(130, 80)">
    <!-- Base Plate -->
    <path d="M 60,250 L 280,250 L 320,290 L 100,290 Z" fill="#334155"/>
    <path d="M 60,245 L 280,245 L 320,285 L 100,285 Z" fill="url(#metalGrad)"/>
    <!-- Rising Arms -->
    <polygon points="110,250 140,250 110,90 80,90" fill="#475569"/>
    <polygon points="230,250 260,250 230,90 200,90" fill="#475569"/>
    <!-- Angled Tray -->
    <polygon points="50,90 290,90 350,180 110,180" fill="#64748b"/>
    <polygon points="50,85 290,85 350,175 110,175" fill="url(#metalGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Ventilation Cutouts -->
    <g fill="#334155">
      <rect x="130" y="105" width="20" height="45" rx="4" transform="skewX(-30)"/>
      <rect x="170" y="105" width="20" height="45" rx="4" transform="skewX(-30)"/>
      <rect x="210" y="105" width="20" height="45" rx="4" transform="skewX(-30)"/>
    </g>
    <!-- Silicone Anti-Slip Hooks -->
    <rect x="95" y="170" width="30" height="18" rx="4" fill="#0284c7"/>
    <rect x="335" y="170" width="30" height="18" rx="4" fill="#0284c7"/>
  </g>
  <text x="300" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#38bdf8">ERGONOMIC ALUMINUM LAPTOP STAND</text>
  <text x="300" y="415" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">6-Level Height Adjustable · Silicone Grips</text>
</svg>
