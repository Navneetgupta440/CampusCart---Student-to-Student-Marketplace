<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="lampBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="lightCone" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#fef08a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="450" fill="url(#lampBg)"/>
  <!-- Light Glow Cone -->
  <polygon points="340,110 180,340 500,340" fill="url(#lightCone)"/>
  <!-- Lamp structure -->
  <g transform="translate(180, 70)">
    <!-- Heavy base -->
    <ellipse cx="140" cy="270" rx="60" ry="16" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <ellipse cx="140" cy="266" rx="58" ry="14" fill="#334155"/>
    <!-- Touch sensor button on base -->
    <circle cx="140" cy="266" r="6" fill="#38bdf8"/>
    <!-- Gooseneck stem -->
    <path d="M 140,266 C 140,180 200,100 160,40" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <!-- Lamp Head -->
    <g transform="translate(160, 40) rotate(-25)">
      <rect x="-10" y="-12" width="120" height="24" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
      <rect x="0" y="-8" width="100" height="16" rx="6" fill="#fef08a"/>
    </g>
  </g>
  <text x="300" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#facc15">RECHARGEABLE LED STUDY DESK LAMP</text>
  <text x="300" y="415" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">3 Color Modes · 2000mAh Battery · USB-C</text>
</svg>
