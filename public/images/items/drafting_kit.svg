<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="draftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#draftBg)"/>
  <!-- Mini Drafter & Technical Drawing Tools -->
  <g transform="translate(100, 60)">
    <!-- Drawing Sheet Board -->
    <rect x="0" y="0" width="400" height="280" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="20" y1="20" x2="380" y2="20"/>
      <line x1="20" y1="260" x2="380" y2="260"/>
      <line x1="20" y1="20" x2="20" y2="260"/>
      <line x1="380" y1="20" x2="380" y2="260"/>
    </g>
    <!-- Drafter Pivot Clamps & Arms -->
    <circle cx="50" cy="50" r="16" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
    <rect x="44" y="44" width="12" height="12" fill="#e0f2fe"/>
    <!-- Arm 1 & 2 -->
    <line x1="50" y1="50" x2="180" y2="120" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <line x1="50" y1="65" x2="180" y2="135" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <circle cx="180" cy="127" r="12" fill="#0284c7"/>
    <!-- Arm to protractor head -->
    <line x1="180" y1="127" x2="260" y2="180" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <!-- Protractor head -->
    <circle cx="260" cy="180" r="28" fill="#38bdf8" opacity="0.85"/>
    <circle cx="260" cy="180" r="6" fill="#0f172a"/>
    <!-- L-Shaped Scales -->
    <rect x="250" y="174" width="120" height="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" rx="2"/>
    <rect x="254" y="174" width="14" height="90" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" rx="2"/>
    <!-- Scale ticks -->
    <line x1="280" y1="174" x2="280" y2="180" stroke="#0f172a"/>
    <line x1="310" y1="174" x2="310" y2="180" stroke="#0f172a"/>
    <line x1="340" y1="174" x2="340" y2="180" stroke="#0f172a"/>
  </g>
  <text x="300" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#38bdf8">ENGINEERING MINI-DRAFTER &amp; DRAWING SET</text>
  <text x="300" y="415" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Complete Kit with Scales, Clamps &amp; Pouch</text>
</svg>
