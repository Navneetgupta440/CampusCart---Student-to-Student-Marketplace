<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="coatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#coatBg)"/>
  <!-- Pure White Cotton Lab Coat Silhouette -->
  <g transform="translate(170, 45)">
    <!-- Hanger -->
    <path d="M 60,35 Q 130,0 200,35" fill="none" stroke="#ca8a04" stroke-width="6"/>
    <path d="M 130,0 C 130,-15 145,-15 145,-5" fill="none" stroke="#ca8a04" stroke-width="4"/>
    <!-- Coat Body -->
    <path d="M 60,35 L 20,130 L 50,140 L 65,90 L 65,310 L 195,310 L 195,90 L 210,140 L 240,130 L 200,35 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Lapels -->
    <polygon points="100,35 130,110 80,100" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="160,35 130,110 180,100" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Center Button Line -->
    <line x1="130" y1="110" x2="130" y2="310" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Buttons -->
    <circle cx="130" cy="140" r="4" fill="#64748b"/>
    <circle cx="130" cy="180" r="4" fill="#64748b"/>
    <circle cx="130" cy="220" r="4" fill="#64748b"/>
    <circle cx="130" cy="260" r="4" fill="#64748b"/>
    <!-- Chest Pocket Left -->
    <rect x="80" y="130" width="30" height="35" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Waist Pockets -->
    <rect x="75" y="225" width="45" height="50" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="140" y="225" width="45" height="50" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
  <text x="300" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#2dd4bf">PURE COTTON WHITE LAB COAT (SIZE M)</text>
  <text x="300" y="415" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#99f6e4">Unisex · Physics &amp; Chemistry Practicals · 3 Pockets</text>
</svg>
