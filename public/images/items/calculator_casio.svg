<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="calcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#calcBg)"/>
  <!-- Scientific Calculator Body -->
  <g transform="translate(200, 35)">
    <rect x="8" y="8" width="200" height="370" rx="20" fill="#020617" opacity="0.5"/>
    <rect x="0" y="0" width="200" height="370" rx="20" fill="#1e222d" stroke="#334155" stroke-width="2"/>
    <!-- Brand -->
    <text x="25" y="32" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#cbd5e1" letter-spacing="1">CASIO</text>
    <text x="110" y="32" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#94a3b8">fx-991EX</text>
    <!-- Screen -->
    <rect x="20" y="44" width="160" height="65" rx="4" fill="url(#screenGrad)" stroke="#15803d" stroke-width="1.5"/>
    <text x="30" y="72" font-family="monospace" font-weight="700" font-size="14" fill="#14532d">sin(45°) + √2/2</text>
    <text x="120" y="98" font-family="monospace" font-weight="800" font-size="16" fill="#14532d">1.4142</text>
    <!-- Solar Cell -->
    <rect x="130" y="18" width="48" height="16" rx="2" fill="#312e81" stroke="#4338ca" stroke-width="1"/>
    <!-- Top D-pad Buttons -->
    <circle cx="100" cy="135" r="18" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <circle cx="50" cy="135" r="8" fill="#d97706"/>
    <circle cx="150" cy="135" r="8" fill="#dc2626"/>
    <!-- Function Key Grid (5 rows of 5) -->
    <g transform="translate(20, 165)" fill="#334155" rx="3">
      <!-- Row 1 -->
      <rect x="0" y="0" width="26" height="16" rx="3"/>
      <rect x="33" y="0" width="26" height="16" rx="3"/>
      <rect x="67" y="0" width="26" height="16" rx="3"/>
      <rect x="101" y="0" width="26" height="16" rx="3"/>
      <rect x="134" y="0" width="26" height="16" rx="3"/>
      <!-- Row 2 -->
      <rect x="0" y="22" width="26" height="16" rx="3"/>
      <rect x="33" y="22" width="26" height="16" rx="3"/>
      <rect x="67" y="22" width="26" height="16" rx="3"/>
      <rect x="101" y="22" width="26" height="16" rx="3"/>
      <rect x="134" y="22" width="26" height="16" rx="3"/>
    </g>
    <!-- Numeric Pad Grid (4 rows of 4) -->
    <g transform="translate(20, 220)" fill="#475569">
      <!-- 7 8 9 DEL AC -->
      <rect x="0" y="0" width="34" height="26" rx="4"/>
      <rect x="42" y="0" width="34" height="26" rx="4"/>
      <rect x="84" y="0" width="34" height="26" rx="4"/>
      <rect x="126" y="0" width="34" height="26" rx="4" fill="#b91c1c"/>
      <!-- 4 5 6 * / -->
      <rect x="0" y="32" width="34" height="26" rx="4"/>
      <rect x="42" y="32" width="34" height="26" rx="4"/>
      <rect x="84" y="32" width="34" height="26" rx="4"/>
      <rect x="126" y="32" width="34" height="26" rx="4"/>
      <!-- 1 2 3 + - -->
      <rect x="0" y="64" width="34" height="26" rx="4"/>
      <rect x="42" y="64" width="34" height="26" rx="4"/>
      <rect x="84" y="64" width="34" height="26" rx="4"/>
      <rect x="126" y="64" width="34" height="26" rx="4"/>
      <!-- 0 . x10 Ans = -->
      <rect x="0" y="96" width="34" height="26" rx="4"/>
      <rect x="42" y="96" width="34" height="26" rx="4"/>
      <rect x="84" y="96" width="34" height="26" rx="4"/>
      <rect x="126" y="96" width="34" height="26" rx="4" fill="#2563eb"/>
    </g>
  </g>
</svg>
