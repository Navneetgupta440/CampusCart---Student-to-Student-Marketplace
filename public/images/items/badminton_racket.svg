<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="badBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#badBg)"/>
  <g transform="translate(300, 200) rotate(-35)">
    <!-- Racket head oval -->
    <ellipse cx="0" cy="-90" rx="65" ry="85" fill="none" stroke="#f43f5e" stroke-width="6"/>
    <!-- String grid pattern -->
    <g stroke="#ffffff" stroke-width="0.8" opacity="0.6">
      <line x1="-50" y1="-120" x2="50" y2="-120"/>
      <line x1="-58" y1="-90" x2="58" y2="-90"/>
      <line x1="-50" y1="-60" x2="50" y2="-60"/>
      <line x1="-30" y1="-30" x2="30" y2="-30"/>
      <line x1="-30" y1="-150" x2="30" y2="-150"/>
      <line x1="-40" y1="-150" x2="-40" y2="-30"/>
      <line x1="-20" y1="-165" x2="-20" y2="-15"/>
      <line x1="0" y1="-170" x2="0" y2="-10"/>
      <line x1="20" y1="-165" x2="20" y2="-15"/>
      <line x1="40" y1="-150" x2="40" y2="-30"/>
    </g>
    <!-- T-Joint -->
    <polygon points="-8,-5 8,-5 5,10 -5,10" fill="#e11d48"/>
    <!-- Shaft -->
    <rect x="-4" y="10" width="8" height="110" fill="#0284c7"/>
    <!-- Grip handle -->
    <rect x="-8" y="120" width="16" height="85" rx="3" fill="#1e293b"/>
    <!-- Grip tape winding -->
    <g stroke="#f8fafc" stroke-width="1.5" opacity="0.3">
      <line x1="-8" y1="135" x2="8" y2="145"/>
      <line x1="-8" y1="155" x2="8" y2="165"/>
      <line x1="-8" y1="175" x2="8" y2="185"/>
      <line x1="-8" y1="195" x2="8" y2="205"/>
    </g>
    <!-- End Cap -->
    <rect x="-9" y="205" width="18" height="10" rx="2" fill="#047857"/>
  </g>
  <text x="300" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#f43f5e">YONEX MUSCLE POWER BADMINTON RACKET</text>
  <text x="300" y="415" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#99f6e4">BG65 Titanium String 24 lbs · Full Thermal Cover</text>
</svg>
